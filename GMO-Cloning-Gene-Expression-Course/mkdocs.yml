      - "05 - Expression Constructs and Reporter Genes": modules/05-Expression-Constructs-and-Reporter-Genes.md
      - "06 - GMO Generation": modules/06-GMO-Generation.md
      - "07 - Genome Editing and CRISPR": modules/07-Genome-Editing-and-CRISPR.md
      - "08 - Developmental Gene Expression": modules/08-Developmental-Gene-Expression.md
      - "09 - Spatial and Temporal Gene Expression": modules/09-Spatial-and-Temporal-Gene-Expression.md
      - "10 - Gene Regulatory Networks": modules/10-Gene-Regulatory-Networks.md
