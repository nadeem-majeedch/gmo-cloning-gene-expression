# MkDocs Material configuration for the course website.
# Project site: https://nadeem-majeedch.github.io/gmo-cloning-gene-expression/
site_name: GMO, Cloning Techniques & Developmental and Spatial Gene Expression
site_description: >-
  A complete university-level Molecular Biology teaching module: genetic engineering,
  molecular cloning, vectors, GMO generation, CRISPR, and developmental & spatial gene expression.
site_author: Course teaching team
repo_url: https://github.com/nadeem-majeedch/gmo-cloning-gene-expression
repo_name: nadeem-majeedch/gmo-cloning-gene-expression
site_url: https://nadeem-majeedch.github.io/gmo-cloning-gene-expression/
use_directory_urls: true
strict: true
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  logo: material/dna
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

copyright: >
  <b>GMO, Cloning Techniques &amp; Developmental and Spatial Gene Expression</b> · Instructor:
  <b>Dr. Saira Azam</b>, Assistant Professor, Centre of Excellence in Molecular Biology,
  University of the Punjab, Lahore · Educational resource for academic teaching and learning
  under the MIT License — simulated datasets may not be cited as experimental data.

