# Deploy the MkDocs Material course website to GitHub Pages.
#
# NOTE: the MkDocs project lives in the GMO-Cloning-Gene-Expression-Course/
# subdirectory of this repository, so every build step runs with
# working-directory set accordingly, and the Pages artifact is uploaded from
# GMO-Cloning-Gene-Expression-Course/site.
#
# Pipeline: generate docs/ -> strict build -> link QA -> deploy via the
# official actions/deploy-pages mechanism. Any warning or broken link fails
# the job before deployment.
name: Deploy course site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GMO-Cloning-Gene-Expression-Course
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: GMO-Cloning-Gene-Expression-Course/requirements.txt

      - name: Install site toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate site content (docs/)
        run: python tools/build_site.py

      - name: Build site (strict mode)
        run: mkdocs build --strict

      - name: Verify internal links
        run: python tools/check_site_links.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: GMO-Cloning-Gene-Expression-Course/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages (enable if not yet enabled)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
